# Example ghostctl config for bootstrap on fresh hosts.
# Copy this to config.toml and adjust identity/network values per node.

id = "ghost.local"
project_fetch_on_boot = true
seeds = ["seed.flow", "seed.mongod", "seed.kv", "seed.fs"]
heartbeat_interval = "5s"
admin_listen = "127.0.0.1:7011"

# Admin endpoint mTLS (admin_security.toml). Without admin_tls_cert_file the admin endpoint is
# plaintext and must bind to loopback; privileged actions (execute_envelope, install_dependencies,
# spawn_ghost, bind_mirage) are refused without mTLS. Issue with: make certs-ghost ID=<id>
# admin_tls_cert_file = "certs/ghost.local.crt"
# admin_tls_key_file = "certs/ghost.local.key"
# admin_tls_ca_file = "certs/ca.crt"
# admin_tls_denied_serials = []
# Pinned Mirage principal; required with TLS sessions in production.
# mirage_principal = "edgectl://mirage/mirage.local"

mirage_policy = "headless"
mirage_address = "127.0.0.1:9000"
mirage_peer_identity = "ghost.local"
mirage_security_mode = "development"
mirage_tls_enabled = false
mirage_tls_mutual = false
mirage_tls_cert_file = ""
mirage_tls_key_file = ""
mirage_tls_ca_file = ""
mirage_tls_server_name = ""
mirage_tls_insecure_skip_verify = false

# Seed dependency installation policy.
# Ghost executes only Mirage-approved plans built from Mirage's dependency catalog
# (propose_dependencies -> approve_dependencies -> execute_dependencies); [[seed_install]]
# entries are rejected. The whitelist limits which seed ids a plan may install for.
# Install plans are refused unless admin_frame_auth_token is set and presented by Mirage
# (miragectl ghost_admin_frame_auth_token), and every step must be a dependency-catalog entry.
seed_install_enabled = true
seed_install_root = "local/seeds"
seed_install_whitelist = ["seed.docker", "seed.mongod"]
